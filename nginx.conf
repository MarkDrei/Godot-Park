server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The engine (.wasm) and game data (.pck) compress very well.
  gzip on;
  gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;
  gzip_min_length 1024;
  gzip_comp_level 6;

  # Android app download.
  location = /download {
    add_header Cache-Control "no-cache";
    try_files /download.html =404;
  }
  location = /bank-frei.apk {
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="bank-frei.apk"';
    add_header Cache-Control "no-cache";
  }

  # File names are not hashed: always revalidate (ETag) so a deploy is picked up.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
